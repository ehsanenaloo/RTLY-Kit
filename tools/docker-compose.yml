# Development environment. From the repository root:
#   docker compose -f tools/docker-compose.yml run --rm php composer check
#
# Other PHP versions: services php83, php84 and php85. They mount the same
# repository, so they share vendor/; to test another version without touching
# your vendor/, copy the sources inside the container first, e.g.
#   docker compose -f tools/docker-compose.yml run --rm -T php85 sh -c \
#     "mkdir /w && tar -C /app --exclude=./vendor --exclude=./.git -cf - . | tar -C /w -xf - \
#      && cd /w && composer update --no-interaction && composer check"
x-php: &php
  volumes: ["..:/app"]
  working_dir: /app

services:
  php:
    <<: *php
    build: { context: ., args: { PHP_VERSION: "8.2.34" } }
  php83:
    <<: *php
    build: { context: ., args: { PHP_VERSION: "8.3.35" } }
  php84:
    <<: *php
    build: { context: ., args: { PHP_VERSION: "8.4.26" } }
  php85:
    <<: *php
    build: { context: ., args: { PHP_VERSION: "8.5.11" } }
