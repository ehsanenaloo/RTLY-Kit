name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Show example calls. RTLY-Kit stays zero-dependency; say if your idea needs one.
      render: php
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
